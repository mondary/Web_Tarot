[package]
name = "tarot-app"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "Element", "HtmlElement", "HtmlInputElement",
  "HtmlImageElement", "HtmlMetaElement", "Event", "EventTarget",
  "Storage", "History", "Location", "Response", "Touch", "TouchEvent",
  "DomTokenList", "CssStyleDeclaration", "AddEventListenerOptions", "KeyboardEvent", "console",
  "TouchList",
]
