<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<title>Tarot Divinatoire</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔮</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--bg-2:#0a0907;--fg:#f1ede4;--muted:#8a8378;--line:rgba(241,237,228,.08);--ease:cubic-bezier(.16,1,.3,1);--accent:#c9a227;--ac:var(--accent);--mat:#fff;--mat-line:rgba(255,255,255,.22)}
*{margin:0;padding:0;box-sizing:border-box}html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:'Plus Jakarta Sans',sans-serif;-webkit-font-smoothing:antialiased}
img{display:block;max-width:100%}a{color:inherit;text-decoration:none}
.fx-grain{position:fixed;inset:0;z-index:9000;pointer-events:none;opacity:.035;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.fx-vignette{position:fixed;inset:0;z-index:8990;pointer-events:none;background:radial-gradient(120% 100% at 50% 50%,transparent 55%,rgba(0,0,0,.55) 100%)}
#loader{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:var(--bg);transition:opacity .6s var(--ease)}
#loader.gone{opacity:0;pointer-events:none}
#loader .pulse{width:60px;height:60px;border-radius:50%;border:2px solid var(--ac);animation:lp 1.6s ease-in-out infinite}
@keyframes lp{0%,100%{transform:scale(.8);opacity:.3}50%{transform:scale(1.1);opacity:1}}
.brand{position:fixed;top:1.6rem;left:1.6rem;z-index:200;display:flex;align-items:center;gap:.65rem;font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.32em;text-transform:uppercase;color:var(--muted)}
.brand b{color:var(--fg);font-weight:400}.brand em{color:var(--ac);font-style:normal}
.full-grid-head{padding:6rem 4vw 2rem;border-bottom:1px solid var(--line)}
.full-grid-head h1{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(3rem,7vw,5.5rem);line-height:.9;text-transform:uppercase;letter-spacing:-.02em}
.full-grid-head h1 em{font-style:italic;color:var(--ac);font-weight:400}
.full-grid-head .sub{color:var(--muted);font-size:.9rem;font-weight:300;margin-top:.7rem;max-width:40rem}
.full-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:1.2rem;padding:2rem 4vw 6rem;align-items:start}
.fam-sep{grid-column:1/-1;display:flex;align-items:center;gap:1.5rem;padding:2.5rem 0 1rem;margin-top:1rem;border-bottom:1px solid var(--line)}
.fam-sep-art{flex:0 0 auto;width:80px;height:120px;position:relative;display:grid;place-items:center}
.fam-sep-art .glyph{font-family:'Cormorant Garamond',serif;font-size:3rem;color:var(--ac);line-height:1;text-align:center}
.fam-sep-art .ring{position:absolute;inset:0;border:1.5px solid var(--ac);border-radius:.6rem;opacity:.3}
.fam-sep-body .lbl{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.26em;text-transform:uppercase;color:var(--ac);margin-bottom:.4rem}
.fam-sep-body .name{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(1.8rem,3.5vw,2.8rem);line-height:1;text-transform:uppercase}
.fam-sep-body .name em{font-style:italic;color:var(--ac);font-weight:400}
.fam-sep-body .desc{color:var(--muted);font-size:.82rem;line-height:1.5;font-weight:300;margin-top:.5rem;max-width:32rem}
.fam-sep-count{flex:0 0 auto;font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);text-align:right}
.fam-sep-count b{display:block;font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--fg);letter-spacing:0;text-transform:none;font-weight:400}
.mini{position:relative;border-radius:.9rem;overflow:hidden;background:var(--mat);border:1px solid var(--mat-line);cursor:pointer;transition:.5s var(--ease);display:flex;flex-direction:column;box-shadow:0 10px 28px rgba(0,0,0,.35)}
.mini:hover,.mini.selected{transform:translateY(-6px);border-color:var(--ac);box-shadow:0 16px 40px rgba(0,0,0,.5)}
.mini .ph{aspect-ratio:2/3;display:flex;align-items:center;justify-content:center;padding:.5rem}
.mini .ph img{height:100%;object-fit:contain;transition:transform .6s var(--ease)}
.mini:hover .ph img{transform:scale(1.05)}
.mini .cap{padding:.6rem .75rem .7rem;border-top:1px solid rgba(0,0,0,.06);font-size:.78rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;background:var(--mat)}
.mini .cap .nm{font-family:'Cormorant Garamond',serif;font-size:1.02rem;line-height:1.1;font-weight:500;color:#1c1814;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .cap .no{font-family:'DM Mono',monospace;font-size:.62rem;color:#a59c8e;letter-spacing:.1em;flex:0 0 auto}
.d-stage{position:fixed;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;z-index:5000;background:var(--bg);display:none}
.d-stage.open{display:block}
.back-btn{position:fixed;top:1.6rem;left:1.6rem;z-index:300;display:flex;align-items:center;gap:.6rem;font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.24em;text-transform:uppercase;color:var(--muted);padding:.6rem 1.1rem;border:1px solid var(--line);border-radius:50px;background:var(--bg);transition:.4s var(--ease);cursor:pointer}
.back-btn:hover{color:var(--fg);border-color:var(--ac)}
.d-hero{position:relative;height:70vh;min-height:400px;width:100%;overflow:hidden;background:#0a0a0a}
.d-hero-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;filter:saturate(1.05) contrast(1.02)}
.d-hero::before{content:'';position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,transparent 22%,transparent 45%,rgba(10,10,10,.55) 72%,#0a0a0a 100%)}
.d-panel{position:relative;z-index:2;background:#0a0a0a;margin-top:-28px;border-radius:26px 26px 0 0;padding:34px 8% 120px;min-height:60vh}
.d-panel-inner{max-width:46rem;margin:0 auto}
.d-meta{font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);margin-bottom:14px;display:flex;gap:.8rem;align-items:center;flex-wrap:wrap}
.d-meta b{color:var(--ac);font-weight:400}.d-meta .sep{opacity:.4}
.d-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.4rem,5.5vw,4.6rem);line-height:1;text-transform:uppercase;margin:0 0 22px}
.d-title em{font-style:italic;color:var(--ac);font-weight:400;text-shadow:0 0 28px rgba(255,255,255,.12)}
.es-badges{display:flex;flex-direction:column;gap:1rem;margin:2rem auto 2.5rem;align-items:center;text-align:center;max-width:700px}
.es-badge.resp{display:inline-flex;align-items:center;gap:.35rem;padding:.3rem .7rem;border-radius:999px;font-size:.72rem;font-weight:600;letter-spacing:.03em;text-transform:uppercase;background:var(--ac);color:#fff;line-height:1.2}
.es-badge.aff{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:clamp(1.6rem,3vw,2.4rem);line-height:1.2;color:var(--fg);font-style:italic;border-left:3px solid var(--ac);border-radius:0;padding:.5rem 0 .5rem 1.5rem;text-transform:none;display:block;max-width:600px}
.card-of-day{margin:1.8rem 0 2.4rem;padding:1.4rem 1.6rem;background:linear-gradient(135deg,rgba(201,162,39,.12),rgba(201,162,39,.06));border:1px solid rgba(201,162,39,.22);border-radius:.9rem}
.card-of-day-label{display:flex;align-items:center;gap:.5rem;font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ac);margin-bottom:.9rem}
.card-of-day-label .icon{width:1.6rem;height:1.6rem;display:grid;place-items:center;background:rgba(201,162,39,.18);border-radius:50%;font-size:1rem}
.card-of-day-content p{font-family:'Cormorant Garamond',serif;font-size:1.1rem;line-height:1.7;color:var(--fg);margin:0}
.prose{max-width:44rem}.prose h2{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.7rem;margin-bottom:.9rem;margin-top:2rem;display:flex;align-items:center;gap:.8rem}
.prose h2::before{content:'';width:24px;height:1px;background:var(--ac)}
.prose h2 .content-icon{display:inline-flex;width:1.05em;height:1.05em;color:var(--ac);vertical-align:-.12em;flex:0 0 auto;margin-right:.3rem}
.prose h2 .content-icon svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:1.5}
.prose h3{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin:1.4rem 0 .7rem}
.prose p{font-size:1rem;line-height:1.85;color:#d8d2c5;font-weight:300;margin-bottom:.9rem}
.prose p.field{margin-bottom:.5rem;display:flex;gap:.6rem;flex-wrap:wrap;font-size:.92rem;color:#bdb5a6}
.prose p.field strong{color:var(--ac);font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;font-weight:400}
.prose strong{color:var(--fg);font-weight:500}
.prose ul{list-style:none;margin:.6rem 0 1.2rem}
.prose li{position:relative;padding-left:1.4rem;margin-bottom:.5rem;font-size:.98rem;line-height:1.7;color:#cfc8ba;font-weight:300}
.prose li::before{content:'';position:absolute;left:0;top:.65rem;width:6px;height:6px;border-radius:50%;background:var(--ac)}
.prose blockquote{margin:1.6rem 0;padding:1.2rem 1.6rem;border-left:2px solid var(--ac);background:rgba(241,237,228,.03);border-radius:0 .6rem .6rem 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.2rem;line-height:1.6;color:var(--fg)}
.prose img{max-width:300px;margin:1.5rem auto;border-radius:.6rem;box-shadow:0 8px 24px rgba(0,0,0,.4)}
#sec-mots-cles .kw-cols{display:grid;grid-template-columns:1fr 1fr;gap:2rem}
#sec-mots-cles .kw-col h3{font-family:'DM Mono',monospace;font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--ac);margin-bottom:.8rem;padding-bottom:.5rem;border-bottom:1px solid var(--line)}
#sec-mots-cles .kw-col ul{list-style:none;display:grid;gap:.45rem}
#sec-mots-cles .kw-col li{position:relative;padding-left:1rem;color:#d8d2c5;font-size:.92rem;line-height:1.4}
#sec-mots-cles .kw-col li::before{content:'◆';position:absolute;left:0;top:.35rem;color:var(--ac);font-size:.42rem}
@media(max-width:900px){#sec-mots-cles .kw-cols{grid-template-columns:1fr;gap:1rem}}
.theme-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:2rem;margin:2.5rem 0;padding-top:1.5rem;border-top:1px solid var(--line)}
.theme-grid section{margin:0!important;padding:0!important;border:none!important}
.theme-grid section h2{font-family:'Cormorant Garamond',serif;font-size:clamp(1.6rem,2.4vw,2.2rem);font-weight:400;line-height:1;display:flex;align-items:center;gap:.7rem;margin-bottom:.8rem}
.theme-grid section h2::before{display:none}
.theme-grid section p{font-size:.96rem;line-height:1.8;color:#d8d2c5;font-weight:300;margin-bottom:.7rem}
@media(max-width:900px){.theme-grid{grid-template-columns:1fr;gap:1.2rem}}
.d-thumbs{display:flex;gap:8px;overflow-x:auto;padding:1.4rem 0 4px;margin-top:2.6rem;scrollbar-width:thin}
.d-thumb{flex:0 0 auto;width:60px;aspect-ratio:2/3;border-radius:6px;overflow:hidden;background:var(--mat);border:2px solid transparent;cursor:pointer;transition:.3s var(--ease);padding:3px}
.d-thumb img{width:100%;height:100%;object-fit:contain}
.d-thumb:hover{transform:translateY(-3px);border-color:rgba(241,237,228,.5)}
.d-thumb.current{border-color:var(--ac)}
.d-loop{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:1rem;padding:.55rem 1.2rem;background:rgba(10,9,7,.72);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:50px;font-family:'DM Mono',monospace;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;max-width:calc(100vw - 120px)}
.d-loop a{color:var(--muted);transition:.3s var(--ease);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:30vw;cursor:pointer}
.d-loop a:hover{color:var(--fg)}.d-loop .pos{color:var(--fg);flex:0 0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line);padding:0 1rem}
.d-loop .pos b{color:var(--ac);font-weight:400}
.fab-bar{position:fixed;right:max(1.2rem,env(safe-area-inset-right));bottom:max(1.2rem,env(safe-area-inset-bottom));z-index:500}
.search-launch{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--bg-2);border:1px solid var(--line);color:var(--muted);transition:color .2s,border-color .2s;cursor:pointer}
.search-launch:hover{color:var(--accent);border-color:var(--accent)}
.search-launch svg{width:20px;height:20px}
#search{position:fixed;inset:0;z-index:8000;background:rgba(5,5,5,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:none;opacity:0;transition:opacity .3s var(--ease)}
#search.open{display:flex;opacity:1}
.picker-sheet{position:relative;width:100%;background:transparent;display:flex;flex-direction:column;min-height:0}
@media(min-width:901px){
#search.open{align-items:stretch;flex-direction:column}.picker-sheet{height:100vh}
.s-query{flex:0 0 auto;text-align:center;padding:7vh 4vw 1vh;min-height:22vh;display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(4rem,17vw,17rem);line-height:.86;letter-spacing:-.02em;color:var(--fg);word-break:break-word;text-transform:uppercase}
.s-query .ph{color:var(--muted);font-style:italic;font-weight:300;text-transform:none;font-size:.18em;letter-spacing:.04em}
.s-close{position:fixed;top:1.5rem;right:2.2rem;z-index:8001;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(5,5,5,.75);border:1px solid var(--line);color:var(--fg);cursor:pointer}
.s-close svg{width:18px;height:18px}.picker-search{display:none}.picker-top{display:none}.picker-grip{display:none}
.picker-chips{max-width:1500px;margin:0 auto;width:100%;display:flex;gap:.5rem;overflow-x:auto;padding:.9rem 4vw;border-bottom:1px solid var(--line);background:rgba(5,5,5,.7);backdrop-filter:blur(8px);position:sticky;top:0;z-index:2;scrollbar-width:none}
.picker-chips::-webkit-scrollbar{display:none}
.picker-body{flex:1;overflow-y:auto;padding:1.5rem 4vw 6vh;min-height:0}
.picker-body .s-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:1rem;max-width:1500px;margin:0 auto}
}
.chip{flex:0 0 auto;display:inline-flex;align-items:center;gap:.4rem;padding:.55rem .9rem;border-radius:50px;background:rgba(255,255,255,.04);border:1px solid var(--line);color:var(--muted);font-family:'DM Mono',monospace;font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;cursor:pointer;transition:.2s;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:rgba(255,255,255,.22)}
.chip.active{background:var(--ac);color:#050505;border-color:var(--ac)}
.chip .sym{font-size:.95rem;font-family:'Cormorant Garamond',serif}.chip .n{opacity:.55;font-size:.58rem}
.s-grid .mini.sel{transform:translateY(-6px);border:2px solid var(--ac);box-shadow:0 0 0 1px var(--ac),0 16px 40px rgba(0,0,0,.5)}
.s-empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:3rem 0;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.4rem}
@media(max-width:900px){
#search.open{align-items:flex-end}
.picker-sheet{height:92vh;max-height:92vh;background:var(--bg-2);border-top:1px solid var(--line);border-radius:22px 22px 0 0;overflow:hidden;animation:su .38s var(--ease);padding-bottom:env(safe-area-inset-bottom)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.picker-grip{width:38px;height:4px;border-radius:2px;background:rgba(241,237,228,.22);margin:.55rem auto .25rem}
.picker-top{display:flex;align-items:center;justify-content:space-between;padding:.3rem 1.1rem .55rem}
.picker-count{font-family:'DM Mono',monospace;font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}.picker-count b{color:var(--fg);font-weight:400}.picker-count .ac{color:var(--ac)}
.s-close{position:static;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--fg);cursor:pointer}
.picker-search{display:flex;align-items:center;gap:.65rem;margin:0 1rem .05rem;padding:.7rem .9rem;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:50px}
.picker-search .s-input{flex:1;width:100%;margin:0;padding:0;border:none;background:transparent;color:var(--fg);font-family:'Plus Jakarta Sans',sans-serif;font-size:.98rem;outline:none}
.picker-chips{display:flex;gap:.4rem;overflow-x:auto;padding:.65rem 1rem .7rem;border-bottom:1px solid var(--line);scrollbar-width:none}
.picker-body{flex:1;overflow-y:auto;padding:.9rem 1rem 1.2rem;min-height:0}
.picker-body .s-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:.6rem}
}
@media(max-width:900px){
.full-grid{grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:.8rem;padding:.8rem 6vw 6rem}
.full-grid-head{padding:5rem 6vw 1.5rem}.brand{left:1.2rem;top:1.2rem}.back-btn{left:1.2rem;top:1.2rem}
.d-hero{height:55vh;min-height:300px}.d-panel{padding:28px 6% 110px;border-radius:22px 22px 0 0}
.d-loop{font-size:.58rem;gap:.6rem;padding:.45rem .9rem;max-width:calc(100vw - 40px)}
.search-launch{width:34px;height:34px}.search-launch svg{width:16px;height:16px}
}
#err{position:fixed;inset:0;z-index:9998;display:none;place-items:center;background:var(--bg);text-align:center;padding:2rem}
#err.show{display:grid}
#err h1{font-family:'Cormorant Garamond',serif;font-size:1.8rem;margin-bottom:1rem;color:var(--ac)}
#err p{color:var(--muted);font-size:.85rem;line-height:1.6;max-width:28rem}#err input{margin-top:1.5rem}
</style>
</head>
<body>
<div id="loader"><div class="pulse"></div></div>
<div class="fx-grain"></div><div class="fx-vignette"></div>
<div id="err"><div><h1>🔮 Tarot</h1><p id="errP">Sélectionnez tarot.sqlite</p><input type="file" id="filepick" accept=".sqlite,.db"></div></div>
<div class="brand" id="brand" style="display:none"><b>TAROT</b> <em>DIVINATOIRE</em></div>
<div id="landing" style="display:none">
<div class="full-grid-head"><h1>Tarot <em>Divinatoire</em></h1><div class="sub">78 lames du Tarot de Rider-Waite-Smith — cliquez une carte pour découvrir sa signification.</div></div>
<div class="full-grid" id="grid"></div></div>
<div class="fab-bar" id="fabBar" style="display:none"><button class="search-launch" onclick="openSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button></div>
<div id="search"><div class="picker-sheet"><div class="picker-grip"></div><div class="picker-top"><span class="picker-count" id="pickerCount"></span><button class="s-close" onclick="closeSearch()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div><div class="s-query" id="sQuery"><span class="ph">Tapez une lame…</span></div><div class="picker-search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input class="s-input" id="sInput" type="text" autocomplete="off" placeholder="Rechercher…" inputmode="search"></div><div class="picker-chips" id="pickerChips"></div><div class="picker-body"><div class="s-grid" id="sGrid"></div></div></div></div>
<div class="d-stage" id="detail"><div class="back-btn" onclick="closeDetail()">← Retour</div><div class="d-hero"><img class="d-hero-img" id="heroImg" alt=""></div><div class="d-panel"><div class="d-panel-inner" id="dInner"></div></div><div class="d-loop" id="loopBar"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.js"></script>
<script>
let SQL,db,CARDS=[],FAMILIES=[],ES_MAP={},IMG_MAP={};
let currentIdx=-1,searchState={fam:'',q:'',selIdx:0};

// SVG pictos pour sections
const PICTOS={
amour:'<span class="content-icon"><svg viewBox="0 0 24 24"><path d="M20.8 4.8a5.5 5.5 0 0 0-7.8 0L12 5.9l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.9-8.4a5.5 5.5 0 0 0-.1-7.8Z"/></svg></span>',
travail:'<span class="content-icon"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="13" rx="1"/><path d="M8 7V4h8v3M3 12h18M10 12v2h4v-2"/></svg></span>',
finances:'<span class="content-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M14.5 9.5c-.5-.7-1.4-1.1-2.5-1.1-1.5 0-2.5.8-2.5 1.9 0 2.9 5 1.3 5 4.1 0 1.1-1 1.9-2.5 1.9-1.1 0-2.1-.4-2.7-1.2M12 6.8v10.4"/></svg></span>',
guidance:'<span class="content-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="m15.8 8.2-2.2 5.4-5.4 2.2 2.2-5.4 5.4-2.2Z"/></svg></span>',
interpretation:'<span class="content-icon"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.5"/></svg></span>',
signification:'<span class="content-icon"><svg viewBox="0 0 24 24"><path d="m12 3 1.7 5.3H19l-4.3 3.1 1.7 5.3-4.4-3.2-4.4 3.2 1.7-5.3L5 8.3h5.3L12 3Z"/><path d="M12 19v2M4 12H2M22 12h-2"/></svg></span>',
description:'<span class="content-icon"><svg viewBox="0 0 24 24"><path d="M3 5.5c3.7-1.4 6.8-.8 9 1.2 2.2-2 5.3-2.6 9-1.2v13c-3.7-1.4-6.8-.8-9 1.2-2.2-2-5.3-2.6-9-1.2v-13Z"/><path d="M12 6.7v13"/></svg></span>',
affirmation:'<span class="content-icon"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h12"/></svg></span>',
mots:'<span class="content-icon"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></span>',
};

// Restructure HTML: ajoute pictos, mots-clés 2 colonnes, theme-grid
function restructureHtml(html){
  const div=document.createElement('div');div.innerHTML=html;

  // 1. Pictos dans les h2
  div.querySelectorAll('h2').forEach(h2=>{
    if(h2.querySelector('.content-icon'))return;
    const t=h2.textContent.toLowerCase();
    let type='';
    if(t.includes('amour'))type='amour';else if(t.includes('travail'))type='travail';
    else if(t.includes('finance'))type='finances';else if(t.includes('guidance'))type='guidance';
    else if(t.includes('interpr'))type='interpretation';else if(t.includes('signification'))type='signification';
    else if(t.includes('description'))type='description';else if(t.includes('mots-cl'))type='mots';
    if(type&&PICTOS[type]){h2.innerHTML=PICTOS[type]+'<span>'+h2.innerHTML+'</span>';}
  });

  // 2. Mots-clés en 2 colonnes
  const mk=div.querySelector('#sec-mots-cles, section[id*="mots"]');
  if(mk){
    const cols=mk.querySelectorAll('h3');
    if(cols.length>=2){
      const wrap=document.createElement('div');wrap.className='kw-cols';
      cols.forEach(h3=>{
        const col=document.createElement('div');col.className='kw-col';
        let el=h3;
        while(el&&el.tagName!=='H3'){el=el.nextElementSibling;}
        col.appendChild(h3.cloneNode(true));
        let sib=h3.nextElementSibling;
        while(sib&&sib.tagName==='LI'){col.appendChild(sib.cloneNode(true));sib=sib.nextElementSibling;}
        if(col.querySelector('ul'))wrap.appendChild(col);
      });
      if(wrap.children.length>=2){
        // Remove old h3+ul, add wrap
        const oldH3s=mk.querySelectorAll('h3');
        oldH3s.forEach(h3=>{let sib=h3.nextElementSibling;while(sib&&sib.tagName==='LI'){const n=sib.nextElementSibling;sib.remove();sib=n;}h3.remove();});
        // Remove empty ul
        mk.querySelectorAll('ul').forEach(ul=>{if(!ul.children.length)ul.remove();});
        mk.appendChild(wrap);
      }
    }
  }

  // 3. Theme-grid (Amour + Travail + Finances + Guidance)
  const themeNames=['amour','travail','finance','guidance'];
  const sections=div.querySelectorAll('section,div.section');
  const themeSecs=[];
  sections.forEach(s=>{const h2=s.querySelector('h2');if(h2&&themeNames.some(t=>h2.textContent.toLowerCase().includes(t)))themeSecs.push(s);});
  if(themeSecs.length>=2){
    const grid=document.createElement('div');grid.className='theme-grid';
    const parent=themeSecs[0].parentNode;
    themeSecs.forEach(s=>grid.appendChild(s));
    parent.insertBefore(grid,themeSecs[0]);
  }

  return div.innerHTML;
}

async function initSQL(){
  if(typeof initSqlJs==='undefined')throw new Error('sql.js non chargé');
  SQL=await initSqlJs({locateFile:f=>'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/'+f});
}
async function loadDB(){
  try{
    const r=await fetch('./tarot.sqlite');if(!r.ok)throw new Error('HTTP '+r.status);
    db=new SQL.Database(new Uint8Array(await r.arrayBuffer()));
    const t=db.exec('SELECT COUNT(*) FROM cards');if(!t.length)throw new Error('DB vide');
    console.log('DB:',t[0].values[0][0],'cartes');return true;
  }catch(e){console.error('loadDB:',e.message);document.getElementById('errP').textContent='Erreur: '+e.message;return false;}
}
function preloadImages(){
  const stmt=db.prepare('SELECT id,img FROM cards WHERE img IS NOT NULL');let n=0;
  while(stmt.step()){const[id,img]=stmt.get();if(img&&img.length>100){const c=new Uint8Array(img.length);c.set(img);IMG_MAP[id]=URL.createObjectURL(new Blob([c],{type:'image/jpeg'}));n++;}}
  stmt.free();console.log('Images:',n);
}
function loadAll(){
  const fr=db.exec('SELECT key,name,short,element,element_sym,element_line,desc,accent,sort_order FROM families ORDER BY sort_order');
  if(fr.length)FAMILIES=fr[0].values.map(r=>({key:r[0],name:r[1],short:r[2],el:r[3],sym:r[4],line:r[5],desc:r[6],ac:r[7],sort:r[8]}));
  const cr=db.exec('SELECT id,family_key,name,num,sort_global,html,card_of_day FROM cards ORDER BY sort_global');
  if(cr.length)CARDS=cr[0].values.map(r=>({id:r[0],fam:r[1],name:r[2],num:r[3],sort:r[4],html:r[5],cod:r[6]}));
  const er=db.exec('SELECT card_id,affirmation,reponse FROM card_es');
  if(er.length)er[0].values.forEach(r=>ES_MAP[r[0]]={aff:r[1],rep:r[2]});
  preloadImages();
}
function famByKey(k){return FAMILIES.find(f=>f.key===k)||{}}
function renderGrid(){
  const g=document.getElementById('grid');let h='',lastFam=null;
  for(const c of CARDS){
    if(c.fam!==lastFam){const f=famByKey(c.fam);const cnt=CARDS.filter(x=>x.fam===c.fam).length;
      h+=`<div class="fam-sep"><div class="fam-sep-art"><div class="ring"></div><div class="glyph">${f.sym||'✦'}</div></div><div class="fam-sep-body"><div class="lbl">${f.el||''}</div><div class="name">${f.name||c.fam}</div><div class="desc">${f.desc||''}</div></div><div class="fam-sep-count"><b>${cnt}</b>cartes</div></div>`;
      lastFam=c.fam;}
    const url=IMG_MAP[c.id]||'';const gnum=String(c.sort+1).padStart(2,'0');
    h+=`<div class="mini" data-sort="${c.sort}" onclick="openDetail(${c.sort})"><div class="ph">${url?`<img src="${url}" alt="${c.name}" loading="lazy">`:''}</div><div class="cap"><span class="nm">${c.name}</span><span class="no">${gnum}</span></div></div>`;
  }
  g.innerHTML=h;
  renderChips();
}
function renderChips(){
  const ch=document.getElementById('pickerChips');let h=`<button class="chip active" data-fam="" onclick="setFam('')">Tout<span class="n">${CARDS.length}</span></button>`;
  for(const f of FAMILIES){const n=CARDS.filter(c=>c.fam===f.key).length;
    h+=`<button class="chip" data-fam="${f.key}" style="--ac:${f.ac}" onclick="setFam('${f.key}')"><span class="sym">${f.sym}</span>${f.short}<span class="n">${n}</span></button>`;}
  ch.innerHTML=h;
}
function openDetail(sortIdx){
  const idx=CARDS.findIndex(c=>c.sort===sortIdx);if(idx<0)return;currentIdx=idx;
  const c=CARDS[idx],f=famByKey(c.fam),es=ES_MAP[c.id]||{},url=IMG_MAP[c.id]||'';
  const gnum=String(idx+1).padStart(2,'0'),inFam=CARDS.filter(x=>x.fam===c.fam),inFamIdx=inFam.findIndex(x=>x.id===c.id);
  document.getElementById('heroImg').src=url;
  let badges='';if(es.aff)badges+=`<span class="es-badge aff">« ${es.aff} »</span>`;if(es.rep)badges+=`<span class="es-badge resp">${es.rep}</span>`;
  if(badges)badges=`<div class="es-badges">${badges}</div>`;
  let cod='';if(c.cod)cod=`<div class="card-of-day"><div class="card-of-day-label"><span class="icon">☀</span>Carte du Jour</div><div class="card-of-day-content"><p>${c.cod}</p></div></div>`;
  const restructured=restructureHtml(c.html||'<p>Pas de description.</p>');
  let thumbs=inFam.map(fc=>{const u=IMG_MAP[fc.id]||'';return `<div class="d-thumb${fc.id===c.id?' current':''}" onclick="openDetail(${fc.sort})">${u?`<img src="${u}">`:''}</div>`}).join('');
  document.getElementById('dInner').innerHTML=`<div class="d-meta"><b>${gnum}</b> / ${CARDS.length}<span class="sep">·</span>${f.name||c.fam} ${inFamIdx+1}/${inFam.length}<span class="sep">·</span>${f.el||''}</div><h1 class="d-title"><em>${c.name}</em></h1>${badges}${cod}<div class="prose">${restructured}</div><div class="d-thumbs">${thumbs}</div>`;
  const prev=CARDS[(idx-1+CARDS.length)%CARDS.length],next=CARDS[(idx+1)%CARDS.length];
  document.getElementById('loopBar').innerHTML=`<a onclick="openDetail(${prev.sort})">← ${prev.name}</a><span class="pos"><b>${gnum}</b> / ${CARDS.length}</span><a onclick="openDetail(${next.sort})">${next.name} →</a>`;
  document.getElementById('detail').classList.add('open');document.getElementById('detail').scrollTop=0;
}
function closeDetail(){document.getElementById('detail').classList.remove('open');currentIdx=-1;}

// Search
function openSearch(){document.getElementById('search').classList.add('open');document.body.style.overflow='hidden';searchRender();setTimeout(()=>document.getElementById('sInput').focus(),100);}
function closeSearch(){document.getElementById('search').classList.remove('open');document.body.style.overflow='';document.getElementById('sInput').value='';searchState={fam:'',q:'',selIdx:0};syncQuery();setFam('');}
function setFam(f){searchState.fam=f;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('active',c.dataset.fam===f));searchRender();}
function syncQuery(){const q=document.getElementById('sQuery');if(!searchState.q){q.innerHTML='<span class="ph">Tapez une lame…</span>';return;}q.textContent=searchState.q;}
function searchRender(){
  const out=[];
  for(const c of CARDS){if(searchState.fam&&c.fam!==searchState.fam)continue;if(searchState.q&&c.name.toLowerCase().indexOf(searchState.q)===-1&&String(c.num).padStart(2,'0').indexOf(searchState.q)===-1)continue;out.push(c);}
  document.getElementById('pickerCount').innerHTML=`<b>${out.length}</b> <span class="ac">${out.length>1?'lames':'lame'}</span>${searchState.fam?' · '+searchState.fam:''}`;
  const g=document.getElementById('sGrid');
  if(!out.length){g.innerHTML='<div class="s-empty">Aucune lame</div>';return;}
  g.innerHTML=out.map((c,i)=>{const url=IMG_MAP[c.id]||'';const gnum=String(c.sort+1).padStart(2,'0');return `<div class="mini ${i===searchState.selIdx?'sel':''}" onclick="openDetail(${c.sort});closeSearch()"><div class="ph">${url?`<img src="${url}">`:''}</div><div class="cap"><span class="nm">${c.name}</span><span class="no">${gnum}</span></div></div>`}).join('');
  searchState.selIdx=0;
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'&&e.target.id==='sInput'){
    if(e.key==='Enter'){const s=document.querySelector('.s-grid .mini.sel');if(s)s.click();e.preventDefault();}
    if(e.key==='ArrowDown'){const ms=document.querySelectorAll('.s-grid .mini');if(ms.length){searchState.selIdx=(searchState.selIdx+1)%ms.length;searchRender();}}return;}
  if(e.target.tagName==='INPUT')return;
  if(e.key==='Escape'){if(document.getElementById('search').classList.contains('open')){closeSearch();return;}closeDetail();return;}
  if(currentIdx>=0){if(e.key==='ArrowLeft'){const p=CARDS[(currentIdx-1+CARDS.length)%CARDS.length];openDetail(p.sort);}if(e.key==='ArrowRight'){const n=CARDS[(currentIdx+1)%CARDS.length];openDetail(n.sort);}return;}
  // Type-to-search from landing
  if(!document.getElementById('search').classList.contains('open')&&e.key.length===1&&/\p{L}|\p{N}/u.test(e.key)){openSearch();setTimeout(()=>{const i=document.getElementById('sInput');i.value=e.key;searchState.q=e.key.toLowerCase();syncQuery();searchRender();},50);}
});
document.getElementById('sInput').addEventListener('input',function(){searchState.q=this.value.trim().toLowerCase();syncQuery();searchRender();});
document.getElementById('search').addEventListener('click',e=>{if(e.target.id==='search')closeSearch();});

(async()=>{
  try{await initSQL();}catch(e){document.getElementById('errP').textContent='sql.js: '+e.message;document.getElementById('err').classList.add('show');document.getElementById('loader').classList.add('gone');return;}
  const ok=await loadDB();
  if(!ok){document.getElementById('err').classList.add('show');document.getElementById('loader').classList.add('gone');document.getElementById('filepick').onchange=async e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{db=new SQL.Database(new Uint8Array(ev.target.result));document.getElementById('err').classList.remove('show');boot();};r.readAsArrayBuffer(f);};return;}
  boot();
})();
function boot(){loadAll();renderGrid();document.getElementById('loader').classList.add('gone');document.getElementById('brand').style.display='';document.getElementById('landing').style.display='';document.getElementById('fabBar').style.display='';}
</script>
</body>
</html>
