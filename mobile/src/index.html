<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10100e">
  <title>Tarot Divinatoire</title>
  <style>
    @font-face{font-family:CG;src:url('fonts/cormorant-garamond.woff2')}@font-face{font-family:Mono;src:url('fonts/dm-mono-400.woff2')}*{box-sizing:border-box}html{background:#10100e}body{margin:0;background:#10100e;color:#eee7d9;font-family:CG,Georgia,serif;min-height:100dvh}.app{max-width:680px;margin:auto;padding:max(1.2rem,env(safe-area-inset-top)) 1rem calc(5.7rem + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center}.brand,.eyebrow,button,.tag{font:500 .62rem Mono,monospace;letter-spacing:.13em;text-transform:uppercase}.brand{margin:0;color:#d5ad49}.top button{border:1px solid #4b463d;border-radius:99px;background:transparent;color:#eee7d9;padding:.58rem .8rem}h1{font-size:clamp(3.4rem,16vw,6rem);line-height:.8;letter-spacing:-.07em;font-weight:400;margin:2.7rem 0 1rem}h1 em{color:#d5ad49}.lede{color:#b9b1a4;font-size:1.25rem;line-height:1.2;margin:0;max-width:26rem}.actions{display:flex;gap:.6rem;margin:1.7rem 0}.actions button{background:#d5ad49;border:0;color:#17150e;padding:.78rem 1rem}.actions button+button{background:transparent;border:1px solid #4b463d;color:#eee7d9}.filters{display:flex;gap:.45rem;overflow-x:auto;margin:1.6rem -1rem 1.2rem;padding:0 1rem .4rem}.filters button{white-space:nowrap;color:#aaa294;background:transparent;border:1px solid #3d3931;padding:.55rem .65rem}.filters button.active{color:#d5ad49;border-color:#d5ad49}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.75rem}.card{border:0;background:#e9e2d5;padding:4px;border-radius:7px;box-shadow:0 11px 19px -13px #000;position:relative}.card img{width:100%;aspect-ratio:2/3;object-fit:contain;display:block}.card span{position:absolute;left:4px;right:4px;bottom:4px;padding:1rem .35rem .35rem;background:linear-gradient(transparent,#111d);color:#fff;font:600 .86rem CG,serif;text-align:left}.sheet{position:fixed;inset:0;background:#10100e;z-index:5;overflow:auto;transform:translateY(100%);transition:transform .35s cubic-bezier(.16,1,.3,1)}.sheet.open{transform:translateY(0)}.sheet-inner{padding:max(1.2rem,env(safe-area-inset-top)) 1.25rem calc(2rem + env(safe-area-inset-bottom));max-width:680px;margin:auto}.close{float:right;border:1px solid #4b463d;border-radius:50%;background:transparent;color:#eee7d9;width:2.5rem;height:2.5rem;font-size:1.3rem}.detail-img{display:block;clear:both;width:min(65vw,290px);margin:2rem auto;background:#e9e2d5;padding:6px;box-shadow:0 2rem 3rem -2rem #000}.counter{color:#d5ad49;margin:0}.sheet h2{font-size:3.8rem;line-height:.85;letter-spacing:-.06em;font-weight:400;margin:1rem 0}.sheet h2 em{color:#d5ad49}.keywords{font: .62rem Mono;color:#d5ad49;letter-spacing:.1em;text-transform:uppercase}.content{color:#d3ccbe;font-size:1.16rem;line-height:1.4}.nav{display:flex;justify-content:space-between;margin-top:2rem}.nav button{background:none;border:0;color:#d5ad49;padding:0}.empty{color:#b9b1a4;padding:4rem 0;text-align:center}@media(min-width:620px){.grid{grid-template-columns:repeat(4,1fr)}}
  </style>
</head>
<body><main class="app"><header class="top"><p class="brand">Tarot divinatoire</p><button id="search">Rechercher</button></header><h1>Votre tarot,<br><em>partout.</em></h1><p class="lede">Les 78 lames et leurs lectures, sans réseau et sans compte.</p><div class="actions"><button id="draw">Tirer une lame</button><button id="learn">Découvrir</button></div><nav class="filters" id="filters" aria-label="Familles"></nav><section class="grid" id="grid" aria-live="polite"><p class="empty">Chargement des lames…</p></section><p class="eyebrow"><a href="privacy.html" style="color:#aaa294">Confidentialité</a></p></main><section class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheet-inner"><button class="close" aria-label="Fermer">×</button><img class="detail-img" id="detailImg" alt=""><p class="counter" id="counter"></p><h2 id="title"></h2><p class="keywords" id="keywords"></p><article class="content" id="content"></article><nav class="nav"><button id="prev">← précédente</button><button id="next">suivante →</button></nav></div></section><script>
  const state={cards:[],families:[],family:'all',current:0};const $=s=>document.querySelector(s);const clean=s=>String(s||'').replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim();
  fetch('app-data.json').then(r=>r.json()).then(data=>{state.cards=data.cards;state.families=data.families;renderFilters();renderCards()}).catch(()=>$('#grid').innerHTML='<p class="empty">Le contenu n’a pas pu être chargé.</p>');
  const visible=()=>state.cards.filter(c=>state.family==='all'||c.fam===state.family);function renderFilters(){$('#filters').innerHTML=`<button class="active" data-key="all">Tout · 78</button>`+state.families.map(f=>`<button data-key="${f.key}">${f.short||f.name}</button>`).join('');$('#filters').onclick=e=>{const b=e.target.closest('button');if(!b)return;state.family=b.dataset.key;document.querySelectorAll('#filters button').forEach(x=>x.classList.toggle('active',x===b));renderCards()}}
  function renderCards(){$('#grid').innerHTML=visible().map(c=>`<button class="card" data-id="${c.id}" aria-label="Ouvrir ${c.name}"><img loading="lazy" src="img/${c.id}.jpg" alt="${c.name}"><span>${c.name}</span></button>`).join('');$('#grid').onclick=e=>{const b=e.target.closest('.card');if(b)openCard(state.cards.findIndex(c=>c.id===b.dataset.id))}}
  function openCard(i){state.current=i;const c=state.cards[i],f=state.families.find(x=>x.key===c.fam)||{};$('#detailImg').src=`img/${c.id}.jpg`,$('#detailImg').alt=c.name,$('#counter').textContent=`${String(i+1).padStart(2,'0')} / ${state.cards.length} · ${f.name||''}`,$('#title').innerHTML=`<em>${c.name}</em>`,$('#keywords').textContent=(c.keywords_up||'lecture intuitive').split(',').slice(0,4).join(' · '),$('#content').textContent=clean(c.html),$('#sheet').classList.add('open')}
  const close=()=>$('#sheet').classList.remove('open');$('.close').onclick=close;$('#prev').onclick=()=>openCard((state.current-1+state.cards.length)%state.cards.length);$('#next').onclick=()=>openCard((state.current+1)%state.cards.length);$('#draw').onclick=()=>openCard(Math.floor(Math.random()*state.cards.length));$('#learn').onclick=()=>{state.family='majors';renderCards();window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'})};$('#search').onclick=()=>{const q=prompt('Chercher une lame');if(q){state.family='all';$('#grid').innerHTML=state.cards.filter(c=>c.name.toLowerCase().includes(q.toLowerCase())).map(c=>`<button class="card" data-id="${c.id}"><img src="img/${c.id}.jpg" alt="${c.name}"><span>${c.name}</span></button>`).join('')}};document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
  </script></body></html>
