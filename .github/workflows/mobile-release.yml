name: Mobile release packages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [package.json, pnpm-lock.yaml, capacitor.config.ts, src/mobile/**, .github/workflows/mobile-release.yml, src/website/vault.sqlite, icon.png]

permissions:
  contents: read

jobs:
  ios:
    name: iOS archive source
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: {php-version: '8.3', extensions: pdo_sqlite}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm}
      - run: pnpm install --frozen-lockfile
      - run: npm run mobile:icons
      - run: npx cap add ios
      - name: App version from package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" ios/App/App/Info.plist
      - run: npm run ios:build
      - run: mkdir -p release/ios && cp -R ios/App/build/Build/Products/Release-iphoneos/App.app release/ios/TarotDivinatoire-unsigned.app
      - name: Upload unsigned iOS app
        uses: actions/upload-artifact@v4
        with: {name: tarot-divinatoire-ios-unsigned, path: release/ios/TarotDivinatoire-unsigned.app, if-no-files-found: error}
